  </div>

  <script>
    const projectsData = [{"id":1,"title":"PublishPro - Full-Stack MERN Blogging Platform","repoName":"PublishPro-A-Blogging-Platform","category":"Full-Stack","githubUrl":"https://github.com/Vyom1912/PublishPro-A-Blogging-Platform","liveUrl":"https://publishpro-a-blogging-platform.onrender.com","tech":["React 19","Vite","Express 5","MongoDB","Mongoose","Tailwind CSS v4","TinyMCE","Cloudinary","JWT","DOMPurify","Resend"],"paragraph":"PublishPro is an enterprise-grade full-stack blogging platform engineered with the MERN stack (MongoDB, Express 5, React 19, and Node.js) featuring modern Tailwind CSS v4 styling. It provides authors with a comprehensive writing suite powered by the TinyMCE rich text editor, with seamless inline media uploads backed by Cloudinary and Multer. The platform enforces strict security through dual-token JWT authentication stored in HTTP-only cookies, client-side input sanitization with DOMPurify to neutralize XSS vulnerabilities, and role-based authorization for administrative controls. Users can create, update, and categorize articles, leave interactive comments, bookmark favorite reads, manage author profiles, and reset passwords through transactional emails powered by Resend."},{"id":2,"title":"URL Shortener - Full-Stack MVC Platform","repoName":"urlShortener","category":"Full-Stack","githubUrl":"https://github.com/Vyom1912/urlShortener","liveUrl":"https://github.com/Vyom1912/urlShortener","tech":["Node.js","Express 5","MongoDB","EJS","Zod","Argon2","Bcrypt.js","MJML","Resend API","Express-Session","Vercel"],"paragraph":"A production-ready URL shortener and link management service architected strictly on Model-View-Controller (MVC) principles using Express 5, MongoDB Atlas, and EJS server-side rendering. The system enables users to generate condensed shareable links, claim customized vanity shortcodes, and track client traffic with request IP logging. The platform is fortified with rigorous security standards including Zod schema validation for runtime requests and environment variables, Argon2/Bcrypt password hashing, session state persistence, and flash alert feedback. In addition, it integrates an email verification and password reset micro-service utilizing responsive email templates authored in MJML and dispatched via the Resend API."},{"id":3,"title":"Krupa Elevators - Corporate Product Showroom","repoName":"KrupaElevator","category":"React","githubUrl":"https://github.com/Vyom1912/KrupaElevator","liveUrl":"https://vyom1912.github.io/KrupaElevator/","tech":["React 18","Vite 6","Tailwind CSS v3","React Router v6","Lucide React","GitHub Actions CI/CD"],"paragraph":"A modern corporate web showroom and technical digital portal engineered for Krupa Elevators, a vertical transportation engineering company based in Ahmedabad. Built using React 18, Vite, and Tailwind CSS, the application offers an architectural catalog across passenger, hospital, industrial, and capsule elevator systems. Key technical highlights include comprehensive dimensional technical matrices, an interactive cabin interior and finishes showcase, dynamic inquiry routing, and an interactive 19-page digital brochure modal equipped with PDF download functionality and page-flip controls. The application achieves lightning-fast load times and leverages automated GitHub Actions CI/CD pipelines for deployment."},{"id":4,"title":"FoodZing - Food Ordering Web Application","repoName":"FoodZing-A-Food-Ordering-Website","category":"React","githubUrl":"https://github.com/Vyom1912/FoodZing-A-Food-Ordering-Website","liveUrl":"https://Vyom1912.github.io/FoodZing-A-Food-Ordering-Website/","tech":["React 19","Vite","Firebase Authentication","React Router v7","Context API","CSS3"],"paragraph":"FoodZing is a responsive online food ordering single-page application built with React 19 and Vite, styled with custom responsive CSS. Designed based on modern Figma UI specifications, it provides users with an intuitive culinary discovery experience featuring category filtering across menus, dynamic search, and seamless routing with React Router v7. User authentication is powered by Firebase Auth, supporting popup logins and session-aware navigation. Global state management is orchestrated using React Context API to handle real-time item increments, live subtotal and delivery fee calculations, and an end-to-end multi-step checkout workflow with order confirmation states."},{"id":5,"title":"A-Rakhi-Store - Festive E-Commerce Platform","repoName":"A-Rakhi-Store","category":"React","githubUrl":"https://github.com/Vyom1912/A-Rakhi-Store","liveUrl":"https://vyom1912.github.io/A-Rakhi-Store/","tech":["React 19","React Router v7","React Context API","Google Analytics 4 (GA4)","FontAwesome","CSS3"],"paragraph":"A festival-themed e-commerce web storefront developed with React 19 and React Router v7 to showcase traditional, designer, and personalized Rakhi collections. Built with an emphasis on visual branding and high conversion UX, the platform features themed promotional banners, breadcrumb-driven product detail views, dynamic category filters, and an animated preloader screen. The application leverages React Context API to synchronize shopping cart items, calculate live order subtotals, and support promo vouchers. Additionally, Google Analytics 4 (GA4) is integrated to gather real-time behavioral analytics and track user routing across the storefront."},{"id":6,"title":"Apparel E-Commerce Web Store","repoName":"E-commerce-website","category":"React","githubUrl":"https://github.com/Vyom1912/E-commerce-website","liveUrl":"https://vyom1912.github.io/E-commerce-website/","tech":["React 19","React Router v7","React Context API","CSS3 Flexbox/Grid"],"paragraph":"A responsive multi-category apparel shopping application crafted using React 19 and React Router v7. Designed to emulate contemporary fashion storefronts, the platform organizes clothing inventories into dedicated catalogs for Men, Women, and Kids. It features dynamic parameter routing (/product/:productId) with breadcrumb navigation, interactive product image showcases, dedicated cart state management with real-time price summation, and built-in registration/login forms. The application adheres to clean component composition, separating reusable presentation layers like cards, banners, and navbars from business logic."},{"id":7,"title":"Dynamic Resume Builder","repoName":"Resume-Builder","category":"Browser Tools","githubUrl":"https://github.com/Vyom1912/Resume-Builder","liveUrl":"https://vyom1912.github.io/Resume-Builder/","tech":["Vanilla JavaScript","HTML5 <template>","CSS Print Media Queries","LocalStorage API"],"paragraph":"A feature-rich, client-side resume builder engineered using vanilla JavaScript and HTML5 template cloning. The tool features dynamic, schema-driven input forms for repeatable career sections including Work Experience, Education, Projects, and Certifications. Real-time document compilation generates instant live preview updates as users type, with automatic draft auto-saving into LocalStorage to guarantee data persistence between browser reloads. It incorporates specialized CSS print stylesheets that eliminate UI clutter and guarantee clean, pixel-perfect PDF export directly through native browser print dialogues."},{"id":8,"title":"In-Browser Live Code Editor","repoName":"Code-Editor","category":"Browser Tools","githubUrl":"https://github.com/Vyom1912/Code-Editor","liveUrl":"https://vyom1912.github.io/Code-Editor/","tech":["Vanilla JavaScript","HTML5 iframe Sandbox","CSS3 Flexbox","FontAwesome"],"paragraph":"An interactive, web-based coding playground built with HTML5, CSS3, and JavaScript that enables developers to write and test frontend code in real time. It features a tri-pane code entry interface with dedicated editors for HTML markup, CSS styling, and JavaScript logic. Utilizing dynamic DOM parsing and iframe content-window evaluation, the application hot-renders code changes instantly into an isolated sandbox environment upon user keypresses, simulating the core developer experience of platforms like CodePen and JSFiddle entirely within the browser."},{"id":9,"title":"Responsive Web Music Player","repoName":"Music-Player","category":"Browser Tools","githubUrl":"https://github.com/Vyom1912/Music-Player","liveUrl":"https://vyom1912.github.io/Music-Player/","tech":["Vanilla JavaScript","HTML5 Audio API","CSS Glassmorphism","DOM Events"],"paragraph":"A custom-designed, responsive audio streaming web application built with vanilla JavaScript utilizing the native HTML5 Audio API. Packed with a curated playlist of 10+ popular songs, the player provides playback controls including Play/Pause, Next/Previous track navigation, randomized shuffle, repeat looping, and interactive seek bar scrubbing with real-time song duration calculation. Wrapped in a sleek glassmorphism UI with rotating album artwork and volume controls, it delivers a smooth desktop and mobile audio experience without relying on external UI libraries."},{"id":10,"title":"Real-Time Speech-to-Text Transcriber","repoName":"Speech-to-Text","category":"Browser Tools","githubUrl":"https://github.com/Vyom1912/Speech-to-Text","liveUrl":"https://vyom1912.github.io/Speech-to-Text/","tech":["Vanilla JavaScript","Web Speech API (webkitSpeechRecognition)","CSS3 Gradient UI"],"paragraph":"A browser-native voice dictation application built with JavaScript leveraging the Web Speech Recognition API (webkitSpeechRecognition). Designed with a minimalist audio-visual UI, users can initiate voice recording with a single button press. The engine continuously streams microphone audio, processes natural speech patterns, and transcribes voice into editable written text in real time with active listening status indicators, demonstrating browser-based speech processing without external server costs."},{"id":11,"title":"Multi-Voice Text-to-Speech Synthesizer","repoName":"Text-to-Speech","category":"Browser Tools","githubUrl":"https://github.com/Vyom1912/Text-to-Speech","liveUrl":"https://vyom1912.github.io/Text-to-Speech/","tech":["Vanilla JavaScript","SpeechSynthesis API (SpeechSynthesisUtterance)","CSS3"],"paragraph":"An interactive speech synthesis web application that converts arbitrary text into spoken audio using JavaScript and the native Web Speech Synthesis API (SpeechSynthesisUtterance). The application dynamically queries the user's operating system for available voice synthesizers, populates an interactive voice-selection dropdown, and allows custom articulation of text with configurable pitch and playback speed parameters, providing an accessible text-reading utility directly in the client."},{"id":12,"title":"Global Weather Forecast Dashboard","repoName":"Weather-website","category":"REST APIs","githubUrl":"https://github.com/Vyom1912/Weather-website","liveUrl":"https://vyom1912.github.io/Weather-website/","tech":["Vanilla JavaScript","OpenWeatherMap REST API","Async/Await","CSS3"],"paragraph":"A responsive weather application built with vanilla JavaScript utilizing asynchronous HTTP calls to the OpenWeatherMap REST API. Users can search for any city worldwide to instantly retrieve key atmospheric indicators including temperature, humidity percentage, wind speed, and meteorological condition summaries. The application features dynamic icon mapping to visually represent weather states (Rain, Snow, Mist, Clear, Clouds) along with user-friendly error boundaries to gracefully handle 404 responses for unrecognized locations."},{"id":13,"title":"Unsplash Image Search Engine","repoName":"Image-Search-Engine-","category":"REST APIs","githubUrl":"https://github.com/Vyom1912/Image-Search-Engine-","liveUrl":"https://vyom1912.github.io/Image-Search-Engine-/","tech":["Vanilla JavaScript","Unsplash REST API","CSS Grid","Async/Await"],"paragraph":"A high-performance media discovery engine built using vanilla JavaScript that interfaces directly with the Unsplash API. Users can input search keywords to fetch high-resolution photography displayed in a clean, responsive CSS Grid layout. The application implements asynchronous pagination via a 'Show More' button that dynamically loads subsequent pages of content into the DOM without refreshing the page, providing a fast and fluid search experience for high-resolution stock media."},{"id":14,"title":"Serverless Email Subscription Form","repoName":"Email-Subscription-","category":"REST APIs","githubUrl":"https://github.com/Vyom1912/Email-Subscription-","liveUrl":"https://vyom1912.github.io/Email-Subscription-/","tech":["Vanilla JavaScript","Google Apps Script","Google Sheets API","HTML5 Validation"],"paragraph":"A serverless lead capture and newsletter subscription form created with HTML5, CSS3, and JavaScript that uses Google Sheets as a cloud database backend. By submitting form data asynchronously via Fetch to a custom Google Apps Script webhook, subscriber emails are verified and appended directly into Google Sheets in real time. It features responsive input validation, animated loading indicators, and self-dismissing success notifications without requiring a dedicated Node.js server."},{"id":15,"title":"Interactive Drag and Drop & File Upload Interface","repoName":"Drag-Drop","category":"Browser Tools","githubUrl":"https://github.com/Vyom1912/Drag-Drop","liveUrl":"https://vyom1912.github.io/Drag-Drop/","tech":["Vanilla JavaScript","HTML5 Drag and Drop API","FileReader API","CSS3"],"paragraph":"A dual-purpose interactive interface engineered with vanilla JavaScript demonstrating advanced utilization of the native HTML5 Drag and Drop API. The application showcases two distinct UX patterns: moving and reordering cards between separate kanban-style drop containers with visual hover cues, and a full file upload drop zone featuring live thumbnail previews, file removal, and direct download links for the last dropped document."},{"id":16,"title":"Dad Jokes Generator (Promises vs. Async/Await)","repoName":"Dad-jokes","category":"REST APIs","githubUrl":"https://github.com/Vyom1912/Dad-jokes","liveUrl":"https://vyom1912.github.io/Dad-jokes/","tech":["Vanilla JavaScript","icanhazdadjoke REST API","Promises","Async/Await","CSS3"],"paragraph":"A lighthearted web application developed in vanilla JavaScript to deliver over 100 jokes queried from the icanhazdadjoke REST API. The codebase serves as a clear educational demonstration of asynchronous JavaScript paradigms, implementing the API call with both ES6 Promise chaining (.then() / .catch()) and modern async/await syntax with structured try-catch error handling, wrapped in a playful, responsive card interface."},{"id":17,"title":"QR Code Generator & Image Exporter","repoName":"QR-Code-Generater","category":"Browser Tools","githubUrl":"https://github.com/Vyom1912/QR-Code-Generater","liveUrl":"https://vyom1912.github.io/QR-Code-Generater/","tech":["Vanilla JavaScript","QR Server API","HTML5 Canvas API","CSS3"],"paragraph":"A responsive web tool built with JavaScript that dynamically converts URLs and plaintext into scannable high-resolution QR codes. Leveraging the QR Server API alongside the HTML5 Canvas API, the application renders real-time graphic previews and enables users to download the generated QR code in multiple image formats (JPG/PNG), complete with input error shaking animations and responsive touch styling."},{"id":18,"title":"Two-Player Tic-Tac-Toe Game","repoName":"TIC-TAC-TOE-GAME","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/TIC-TAC-TOE-GAME","liveUrl":"https://vyom1912.github.io/TIC-TAC-TOE-GAME/","tech":["Vanilla JavaScript","CSS Grid","Matrix Evaluation","DOM Manipulation"],"paragraph":"A responsive two-player Tic-Tac-Toe game engineered with vanilla JavaScript and CSS Grid. The core engine implements a multidimensional win-condition matrix to evaluate rows, columns, and diagonal lines on every move. It manages player turn alternation ('X' and 'O'), real-time winner announcements, draw game handling, and seamless board reset mechanisms with clean DOM updates."},{"id":19,"title":"Google Keep Clone - React Notes App","repoName":"To-Do-App-using-ReactJs","category":"React","githubUrl":"https://github.com/Vyom1912/To-Do-App-using-ReactJs","liveUrl":"https://vyom1912.github.io/To-Do-App-using-ReactJs/","tech":["React 19","Vite","Tailwind CSS v4","LocalStorage API"],"paragraph":"A note-keeping single page application inspired by Google Keep, developed with React 19, Vite, and styled with modern Tailwind CSS v4. Built with modular component architecture (CreateNote, Note, Header, Footer), it features title and content composition, responsive masonry-style card grids, animated note deletion, and automatic LocalStorage persistence so user thoughts are preserved across sessions."},{"id":20,"title":"Productivity To-Do List with Reordering","repoName":"To-Do-List","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/To-Do-List","liveUrl":"https://vyom1912.github.io/To-Do-List/","tech":["Vanilla JavaScript","LocalStorage","Up/Down Reordering","FontAwesome","CSS3"],"paragraph":"A sleek task management tool built with vanilla JavaScript that elevates the standard to-do list with interactive task prioritization. Users can add tasks, toggle completion states with custom checkmarks, delete items, and reorder tasks up or down using dedicated arrow controls. All task modifications and sequence orderings are automatically serialized into LocalStorage to maintain user state."},{"id":21,"title":"Custom React Hook Architecture (useFetch)","repoName":"tutedude-assignment-5","category":"React","githubUrl":"https://github.com/Vyom1912/tutedude-assignment-5","liveUrl":"https://vyom1912.github.io/tutedude-assignment-5/","tech":["React 19","Vite","Custom Hook (useFetch)","Escuelajs API","CSS3"],"paragraph":"An advanced React 19 architectural project demonstrating custom hook encapsulation and clean state management. It features a custom useFetch(url) hook that manages data, loading, and error states while consuming product data from the Escuelajs REST API. The UI cleanly presents product cards with price tags, images, and conditional loading/error fallbacks, highlighting clean separation of data fetching from component rendering."},{"id":22,"title":"Core Node.js HTTP Web Server (Laundry Mart)","repoName":"tutedude-assignment-6","category":"Full-Stack","githubUrl":"https://github.com/Vyom1912/tutedude-assignment-6","liveUrl":"https://github.com/Vyom1912/tutedude-assignment-6","tech":["Node.js Core (http, fs, path)","HTML5","CSS3"],"paragraph":"A foundational backend project demonstrating low-level web server mechanics built using pure Node.js without third-party frameworks like Express. Leveraging Node's core http, fs, and path modules, the server implements custom URL routing for Home, About, and Contact pages, streams static HTML and CSS files asynchronously, serves appropriate MIME Content-Type headers, and provides a custom 404 Not Found error page."},{"id":23,"title":"The Maroons - Creative Digital Agency Website","repoName":"TheMaroons","category":"Portfolios","githubUrl":"https://github.com/Vyom1912/TheMaroons","liveUrl":"https://themaroons.in/","tech":["HTML5","CSS3 (Responsive)","JavaScript","AOS (Animate On Scroll)"],"paragraph":"A responsive agency web portal designed for 'The Maroons' creative studio. Built using semantic HTML5, CSS3, and JavaScript, the site features modern branding, service offerings, and an interactive portfolio showcase categorized into web development and digital design. The interface incorporates scroll-triggered entrance effects using AOS (Animate On Scroll) and responsive layouts optimized for mobile and desktop screens."},{"id":24,"title":"Vyom Patel - Personal Developer Portfolio","repoName":"Portfolio-Vyom","category":"Portfolios","githubUrl":"https://github.com/Vyom1912/Portfolio-Vyom","liveUrl":"https://vyom1912.github.io/Portfolio-Vyom/","tech":["HTML5","CSS3","JavaScript","AOS Animation","FontAwesome"],"paragraph":"The personal developer portfolio of Vyom Patel, engineered with HTML5, CSS3, and JavaScript. The site provides visitors with a comprehensive introduction to his full-stack skillset, featuring animated technology badges, interactive project cards linked to live demos, a downloadable resume, and direct social connection channels, enhanced with scroll animations and responsive navigation."},{"id":25,"title":"CodeAchieve - Corporate Landing Page","repoName":"Landing-Page-CodeAchieve","category":"Portfolios","githubUrl":"https://github.com/Vyom1912/Landing-Page-CodeAchieve","liveUrl":"https://vyom1912.github.io/Landing-Page-CodeAchieve/","tech":["HTML5","CSS3 (Flexbox/Grid)","JavaScript","Responsive Navigation"],"paragraph":"A modern corporate landing page developed for CodeAchieve to present software development services and training programs. Designed with semantic HTML5, custom responsive CSS, and JavaScript, it features a hero section, feature highlights, a portfolio gallery, a smooth scroll-to-top button, and a mobile-friendly slide-out hamburger navigation menu."},{"id":26,"title":"Interactive Knowledge Quiz Application","repoName":"Quiz--front-end-development","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Quiz--front-end-development","liveUrl":"https://vyom1912.github.io/Quiz--front-end-development/","tech":["Vanilla JavaScript","JSON Data Structures","CSS3","DOM Manipulation"],"paragraph":"An interactive quiz engine built with vanilla JavaScript that reads question datasets stored in structured JSON objects. It manages question indexing, option selections, answer validation, and score calculation, culminating in a personalized score card display upon completion, demonstrating clean algorithmic DOM manipulation and state tracking."},{"id":27,"title":"Cryptographic Random Password Generator","repoName":"Random-Password-Generator-","category":"Browser Tools","githubUrl":"https://github.com/Vyom1912/Random-Password-Generator-","liveUrl":"https://vyom1912.github.io/Random-Password-Generator-/","tech":["Vanilla JavaScript","Clipboard API","Character Randomization","CSS3"],"paragraph":"A cybersecurity utility built in JavaScript that generates strong, randomized passwords combining uppercase letters, lowercase letters, numeric digits, and special characters. Users can generate passwords with balanced entropy and copy them directly to the clipboard via the native Clipboard API with a single click, accompanied by visual confirmation feedback."},{"id":28,"title":"ContentEditable In-Browser Notepad","repoName":"Notes","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Notes","liveUrl":"https://vyom1912.github.io/Notes/","tech":["Vanilla JavaScript","HTML5 contenteditable","LocalStorage","FontAwesome"],"paragraph":"A minimalist browser notepad created with vanilla JavaScript leveraging HTML5's native contenteditable attribute. Users can compose, edit, and delete paragraphs in real time. All document changes are captured through keyup event listeners and immediately serialized to LocalStorage, ensuring notes persist between browser sessions without external database dependencies."},{"id":29,"title":"Sticky Notes Maker with Dual Edit States","repoName":"Notes-Maker","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Notes-Maker","liveUrl":"https://vyom1912.github.io/Notes-Maker/","tech":["Vanilla JavaScript","LocalStorage JSON Sync","FontAwesome","CSS3"],"paragraph":"A digital sticky-note application built with HTML, CSS, and JavaScript that allows users to create, view, edit, and remove dynamic note cards. It implements dual UI states (switching between static text preview and active textarea editing) with full LocalStorage synchronization, offering a simple and intuitive desktop brainstorming tool."},{"id":30,"title":"Reusable Toast Notification Feedback System","repoName":"Toast-Notifications-","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Toast-Notifications-","liveUrl":"https://vyom1912.github.io/Toast-Notifications-/","tech":["Vanilla JavaScript","CSS3 Keyframe Animations","FontAwesome","DOM Events"],"paragraph":"A lightweight, reusable UI toast notification component developed in pure JavaScript and CSS. Designed to provide non-blocking user feedback, the system supports Success, Error, and Invalid alert variants with distinct color coding and FontAwesome icons, utilizing CSS slide-in animations and automatic 5-second self-dismissal timers."},{"id":31,"title":"Animated PopUp Modal Dialog Component","repoName":"PopUp-Message","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/PopUp-Message","liveUrl":"https://vyom1912.github.io/PopUp-Message/","tech":["Vanilla JavaScript","CSS3 Transitions & Scale Transforms","DOM Events"],"paragraph":"A responsive modal confirmation popup built with HTML, CSS, and JavaScript. It provides a clean confirmation dialog utilizing CSS scale and opacity transforms for fluid entry and exit transitions, easily triggered by UI action buttons and dismissed with a confirmation button or background interaction."},{"id":32,"title":"Horizontal Image Carousel with Wheel Scrolling","repoName":"Image-Slider","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Image-Slider","liveUrl":"https://vyom1912.github.io/Image-Slider/","tech":["Vanilla JavaScript","Mouse Wheel Events","Smooth Scroll Behavior","CSS Flexbox"],"paragraph":"A responsive horizontal image slider built with JavaScript and CSS. It incorporates next and previous arrow buttons with smooth programmatic scrolling, mouse wheel scrolling detection, and circular infinite looping that wraps around to the beginning when reaching gallery boundaries, making it ideal for media portfolios."},{"id":33,"title":"Dual-State Sliding Login & Registration Card","repoName":"Login-Registration-form","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Login-Registration-form","liveUrl":"https://vyom1912.github.io/Login-Registration-form/","tech":["Vanilla JavaScript","CSS3 Transforms & Transitions","Form Validation"],"paragraph":"An animated authentication UI component built with HTML, CSS, and JavaScript that toggles smoothly between Login and Registration views within a single card. Utilizing CSS translation and opacity keyframes, it allows users to switch modes with a single click without page reloads, offering a polished user entry interface."},{"id":34,"title":"Real-Time Analog Clock with Degree Rotation","repoName":"Analog-colck","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Analog-colck","liveUrl":"https://vyom1912.github.io/Analog-colck/","tech":["Vanilla JavaScript","System Date Object","Rotational CSS Transforms","Interval Timers"],"paragraph":"A visual analog clock web application created using vanilla JavaScript, HTML, and CSS. The script continuously accesses the system Date object and calculates exact rotational angles for hour, minute, and second hands every second, updating CSS rotate() transforms in real time to simulate physical mechanical movement."},{"id":35,"title":"Interactive Arithmetic Calculator","repoName":"Calculator","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Calculator","liveUrl":"https://vyom1912.github.io/Calculator/","tech":["Vanilla JavaScript","Arithmetic Expression Evaluation","CSS Grid","DOM Events"],"paragraph":"A clean digital calculator built with HTML, CSS, and JavaScript. Featuring a responsive grid keypad, it handles standard mathematical operations, chain calculations, single-digit backspace deletion (DEL), and complete reset (AC) with immediate numerical display updates."},{"id":36,"title":"Interactive Light Switch Simulation","repoName":"Light-on-off","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Light-on-off","liveUrl":"https://vyom1912.github.io/Light-on-off/","tech":["Vanilla JavaScript","DOM Image Source Swapping","CSS3"],"paragraph":"A beginner-friendly interactive web project built with vanilla JavaScript demonstrating fundamental DOM manipulation. Clicking the toggle switch swaps image assets in real time to simulate turning a light bulb on and off with immediate visual feedback."},{"id":37,"title":"Starbucks Product Showcase Clone","repoName":"Starbuck-frontend-development","category":"UI & Games","githubUrl":"https://github.com/Vyom1912/Starbuck-frontend-development","liveUrl":"https://vyom1912.github.io/Starbuck-frontend-development/","tech":["Vanilla JavaScript","DOM Image & Color Manipulation","CSS3 Flexbox"],"paragraph":"A brand-inspired landing page clone modeled after Starbucks' product showcases. Built with HTML, CSS, and JavaScript, clicking drink thumbnail items dynamically updates the hero beverage visual and synchronizes background circle accent colors to match the selected flavor."},{"id":38,"title":"GitHub Profile & Developer Identity","repoName":"Vyom1912","category":"Portfolios","githubUrl":"https://github.com/Vyom1912/Vyom1912","liveUrl":"https://github.com/Vyom1912/Vyom1912","tech":["GitHub Markdown","DevIcons","Shields.io Badges"],"paragraph":"The central GitHub profile configuration repository for developer Vyom Patel. Crafted with custom markdown, technology badges, dynamic status links, and direct contact avenues to showcase developer expertise and provide quick links to live deployed applications."}];

    const grid = document.getElementById("projectsGrid");
    const countDisplay = document.getElementById("projectCountDisplay");
    let currentCategory = "All";
    let searchQuery = "";

    function renderProjects() {
      grid.innerHTML = "";
      const filtered = projectsData.filter(p => {
        const matchesCat = (currentCategory === "All" || p.category === currentCategory);
        const q = searchQuery.toLowerCase();
        const matchesSearch = p.title.toLowerCase().includes(q) || 
                              p.tech.some(t => t.toLowerCase().includes(q)) || 
                              p.paragraph.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      countDisplay.textContent = "Showing " + filtered.length + " of " + projectsData.length + " projects";

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-gray-500"><i class="fa-regular fa-folder-open text-3xl mb-2"></i><p>No projects match your search or filter.</p></div>';
        return;
      }

      filtered.forEach((p) => {
        const card = document.createElement("div");
        card.className = "glass-card rounded-2xl p-5 flex flex-col justify-between";
        
        const hasLive = p.liveUrl && p.liveUrl !== "Local / GitHub Only";
        
        let techHtml = "";
        p.tech.forEach(t => {
          techHtml += '<span class="text-[11px] bg-gray-800/80 text-gray-300 px-2 py-0.5 rounded border border-gray-700/50">' + t + '</span> ';
        });

        card.innerHTML = 
          '<div>' +
            '<div class="flex items-start justify-between gap-2 mb-2">' +
              '<span class="text-[10px] font-semibold tracking-wider uppercase px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">' +
                p.category +
              '</span>' +
              '<div class="flex items-center gap-2">' +
                (hasLive ? 
                  '<a href="' + p.liveUrl + '" target="_blank" rel="noopener noreferrer" class="text-xs text-emerald-400 hover:text-emerald-300 flex items-center gap-1 bg-emerald-500/10 px-2 py-1 rounded-md border border-emerald-500/20 transition-colors" title="Open Live Website"><i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Live</a>' : '') +
                '<a href="' + p.githubUrl + '" target="_blank" rel="noopener noreferrer" class="text-xs text-gray-400 hover:text-white flex items-center gap-1 bg-gray-800 px-2 py-1 rounded-md border border-gray-700 transition-colors" title="View Source on GitHub"><i class="fa-brands fa-github text-[11px]"></i> Repo</a>' +
              '</div>' +
            '</div>' +

            '<h3 class="text-base font-bold text-white mb-2 leading-snug">' + p.title + '</h3>' +

            '<div class="flex flex-wrap gap-1.5 mb-3">' + techHtml + '</div>' +

            '<p class="text-xs text-gray-300 leading-relaxed bg-gray-900/50 p-3 rounded-xl border border-gray-800/80 mb-4" id="para-' + p.id + '">' +
              p.paragraph +
            '</p>' +
          '</div>' +

          '<div class="pt-2 border-t border-gray-800/80 flex items-center justify-between">' +
            '<button onclick="copyText(\x27para-' + p.id + '\x27)" class="copy-btn text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 py-1 px-2.5 rounded-lg border border-indigo-500/20 transition-all">' +
              '<i class="fa-regular fa-copy text-[11px]"></i> Copy Paragraph' +
            '</button>' +
            '<span class="text-[11px] text-gray-500 font-mono">#' + p.id + '</span>' +
          '</div>';
        
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".cat-filter-btn").forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-filter-btn px-3 py-1.5 rounded-full bg-indigo-600 text-white font-medium hover:bg-indigo-500 transition-colors";
        } else {
          btn.className = "cat-filter-btn px-3 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 transition-colors";
        }
      });
      renderProjects();
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderProjects();
    });

    function copyText(elemId) {
      const text = document.getElementById(elemId).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById("copyToast");
        toast.classList.remove("opacity-0");
        toast.classList.add("opacity-100");
        setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0");
        }, 2200);
      });
    }

    renderProjects();
  </script>
</body>
</html>
